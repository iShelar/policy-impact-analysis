# ─── Namespaces ───────────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: payment
  labels:
    env: demo
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    env: demo
---
# ─── Frontend ─────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: default
  labels:
    app: frontend
    tier: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        tier: web
    spec:
      containers:
        - name: frontend
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            limits:
              memory: "64Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: default
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
---
# ─── Backend API ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: default
  labels:
    app: backend
    tier: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        tier: api
    spec:
      containers:
        - name: backend
          image: python:3.11-alpine
          command:
            - python3
            - -c
            - |
              import http.server, threading
              class H(http.server.BaseHTTPRequestHandler):
                def do_GET(self):
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b'{"status":"ok","service":"backend"}')
                def log_message(self, *a): pass
              http.server.HTTPServer(('',8080),H).serve_forever()
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: "64Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: default
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
---
# ─── Payment Service ─────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: payment
  labels:
    app: payment-api
    tier: sensitive
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      labels:
        app: payment-api
        tier: sensitive
    spec:
      containers:
        - name: payment-api
          image: python:3.11-alpine
          command:
            - python3
            - -c
            - |
              import http.server
              class H(http.server.BaseHTTPRequestHandler):
                def do_GET(self):
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b'{"status":"ok","service":"payment"}')
                def log_message(self, *a): pass
              http.server.HTTPServer(('',8443),H).serve_forever()
          ports:
            - containerPort: 8443
          resources:
            limits:
              memory: "64Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: payment-api
  namespace: payment
spec:
  selector:
    app: payment-api
  ports:
    - port: 8443
      targetPort: 8443
---
# ─── Prometheus (monitoring namespace) ───────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
    tier: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
        tier: monitoring
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          ports:
            - containerPort: 9090
          resources:
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
---
# ─── Traffic Generator ────────────────────────────────────────────────────────
# Continuously generates traffic between services to produce Goldmane flows.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-gen
  namespace: default
  labels:
    app: traffic-gen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic-gen
  template:
    metadata:
      labels:
        app: traffic-gen
    spec:
      containers:
        - name: traffic-gen
          image: alpine/curl:latest
          command:
            - sh
            - -c
            - |
              echo "Starting traffic generation..."
              while true; do
                # Frontend → Backend (normal traffic)
                curl -sf http://backend:8080/ -o /dev/null 2>&1
                curl -sf http://frontend:80/ -o /dev/null 2>&1
                # Backend → Payment (cross-namespace, staged policy will flag this)
                curl -sf http://payment-api.payment:8443/ -o /dev/null 2>&1
                # External egress (triggers external connection flows)
                curl -sf --max-time 2 http://httpbin.org/get -o /dev/null 2>&1 || true
                sleep 3
              done
          resources:
            limits:
              memory: "32Mi"
              cpu: "50m"
