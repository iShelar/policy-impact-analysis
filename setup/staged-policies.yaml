# ─── Staged Network Policies for Impact Analysis ─────────────────────────────
# These policies are NOT enforced — they run in "preview" mode.
# Goldmane records what WOULD have happened if they were active.

# Policy 1: Allow frontend → backend on port 8080 (LOW risk, safe to promote)
apiVersion: projectcalico.org/v3
kind: StagedNetworkPolicy
metadata:
  name: allow-frontend-to-backend
  namespace: default
spec:
  selector: app == 'backend'
  types:
    - Ingress
  ingress:
    - action: Allow
      source:
        selector: app == 'frontend'
      destination:
        ports:
          - 8080
---
# Policy 2: Deny backend → payment cross-namespace (MEDIUM risk — some flows blocked)
apiVersion: projectcalico.org/v3
kind: StagedNetworkPolicy
metadata:
  name: deny-cross-namespace-to-payment
  namespace: payment
spec:
  selector: app == 'payment-api'
  types:
    - Ingress
  ingress:
    - action: Deny
      source:
        namespaceSelector: kubernetes.io/metadata.name != 'payment'
---
# Policy 3: Allow Prometheus to scrape all pods (LOW risk)
apiVersion: projectcalico.org/v3
kind: StagedNetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: default
spec:
  selector: all()
  types:
    - Ingress
  ingress:
    - action: Allow
      source:
        namespaceSelector: kubernetes.io/metadata.name == 'monitoring'
      destination:
        ports:
          - 8080
          - 9090
          - 8443
---
# Policy 4: Deny external egress from backend (HIGH risk — traffic-gen hits external URLs)
apiVersion: projectcalico.org/v3
kind: StagedNetworkPolicy
metadata:
  name: deny-backend-external-egress
  namespace: default
spec:
  selector: app == 'backend' || app == 'traffic-gen'
  types:
    - Egress
  egress:
    - action: Allow
      destination:
        namespaceSelector: all()
    - action: Deny
      destination:
        nets:
          - 0.0.0.0/0
---
# Policy 5: Isolate payment namespace (HIGH risk — strictest policy)
apiVersion: projectcalico.org/v3
kind: StagedNetworkPolicy
metadata:
  name: isolate-payment-namespace
  namespace: payment
spec:
  selector: all()
  types:
    - Ingress
    - Egress
  ingress:
    - action: Allow
      source:
        namespaceSelector: kubernetes.io/metadata.name == 'payment'
  egress:
    - action: Allow
      destination:
        namespaceSelector: kubernetes.io/metadata.name == 'payment'
    - action: Allow
      destination:
        ports:
          - 53
